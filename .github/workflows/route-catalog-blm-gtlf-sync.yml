name: Route Catalog BLM GTLF Sync

on:
  schedule:
    - cron: '43 10 * * 3'
  workflow_dispatch:
    inputs:
      states:
        description: Comma-separated BLM administrative state codes to sync.
        required: false
        default: AZ,CA,CO,ID,MT,NV,NM,UT,WY
      layers:
        description: Comma-separated GTLF layer IDs. Defaults to 0,1,2,3 motorized road/trail layers.
        required: false
        default: '0,1,2,3'
      min_miles:
        description: Minimum GTLF segment miles to ingest.
        required: false
        default: '1'
      limit_per_state_layer:
        description: Maximum features to request per state/layer.
        required: false
        default: '100'

permissions:
  contents: read

concurrency:
  group: route-catalog-blm-gtlf-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync BLM GTLF source segments
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      ECS_ROUTE_CATALOG_SYNC_TOKEN: ${{ secrets.ECS_ROUTE_CATALOG_SYNC_TOKEN }}
      STATES: ${{ inputs.states || 'AZ,CA,CO,ID,MT,NV,NM,UT,WY' }}
      LAYERS: ${{ inputs.layers || '0,1,2,3' }}
      MIN_MILES: ${{ inputs.min_miles || '1' }}
      LIMIT_PER_STATE_LAYER: ${{ inputs.limit_per_state_layer || '100' }}

    steps:
      - name: Validate sync secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${ECS_ROUTE_CATALOG_SYNC_TOKEN}" ]]; then
            echo "::error::Missing GitHub secret ECS_ROUTE_CATALOG_SYNC_TOKEN"
            exit 1
          fi

      - name: Build bounded sync payloads
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const states = String(process.env.STATES || '')
            .split(',')
            .map((state) => state.trim().toUpperCase())
            .filter(Boolean);
          const layers = String(process.env.LAYERS || '')
            .split(',')
            .map((layer) => Number(layer.trim()))
            .filter((layer) => Number.isInteger(layer));
          const minMiles = Number(process.env.MIN_MILES || 1);
          const limitPerStateLayer = Number(process.env.LIMIT_PER_STATE_LAYER || 100);

          if (states.length === 0) throw new Error('At least one BLM administrative state code is required.');
          if (states.some((state) => !/^[A-Z]{2}$/.test(state))) throw new Error('states must be two-letter administrative state codes.');
          if (layers.length === 0 || layers.some((layer) => ![0, 1, 2, 3].includes(layer))) {
            throw new Error('layers must be a comma-separated subset of 0,1,2,3.');
          }
          if (!Number.isFinite(minMiles) || minMiles <= 0) throw new Error('min_miles must be positive.');
          if (!Number.isFinite(limitPerStateLayer) || limitPerStateLayer <= 0) {
            throw new Error('limit_per_state_layer must be positive.');
          }

          const payloads = states.map((state) => ({
              states: [state],
              layers,
              minMiles,
              limitPerStateLayer: Math.min(500, Math.round(limitPerStateLayer)),
          }));

          fs.writeFileSync(
            'route-catalog-blm-gtlf-sync-payloads.json',
            JSON.stringify(payloads, null, 2),
          );
          NODE

      - name: Invoke BLM GTLF route catalog sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p route-catalog-blm-gtlf-sync-payloads route-catalog-blm-gtlf-sync-responses

          node <<'NODE'
          const fs = require('fs');
          const payloads = JSON.parse(fs.readFileSync('route-catalog-blm-gtlf-sync-payloads.json', 'utf8'));
          payloads.forEach((payload, index) => {
            fs.writeFileSync(
              `route-catalog-blm-gtlf-sync-payloads/payload-${index}.json`,
              JSON.stringify(payload),
            );
          });
          NODE

          payload_count="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('route-catalog-blm-gtlf-sync-payloads.json','utf8')).length)")"
          for index in $(seq 0 "$((payload_count - 1))"); do
            state="$(node -e "const fs=require('fs'); const payloads=JSON.parse(fs.readFileSync('route-catalog-blm-gtlf-sync-payloads.json','utf8')); console.log(payloads[${index}].states[0])")"
            response_file="route-catalog-blm-gtlf-sync-responses/response-${index}.json"
            status_file="route-catalog-blm-gtlf-sync-responses/status-${index}.txt"

            http_code="$(
              curl --show-error --silent \
                --request POST \
                --header "Content-Type: application/json" \
                --header "x-ecs-sync-token: ${ECS_ROUTE_CATALOG_SYNC_TOKEN}" \
                --data @"route-catalog-blm-gtlf-sync-payloads/payload-${index}.json" \
                "${ECS_SUPABASE_URL%/}/functions/v1/route-catalog-sync-blm-gtlf" \
                --output "${response_file}" \
                --write-out "%{http_code}" || true
            )"
            echo "${http_code}" > "${status_file}"

            if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
              echo "::error::BLM GTLF sync failed for ${state} with HTTP ${http_code}"
              if [[ -s "${response_file}" ]]; then
                echo "Response body:"
                head -c 4000 "${response_file}"
                echo
              else
                echo "No response body was returned."
              fi
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('fs');
          const payloads = JSON.parse(fs.readFileSync('route-catalog-blm-gtlf-sync-payloads.json', 'utf8'));
          const responses = payloads.map((_, index) => {
            const raw = fs.readFileSync(`route-catalog-blm-gtlf-sync-responses/response-${index}.json`, 'utf8');
            try {
              return JSON.parse(raw);
            } catch (error) {
              throw new Error(`BLM GTLF sync response ${index} was not valid JSON: ${raw.slice(0, 300)}`);
            }
          });
          const failed = responses.find((response) => !response.ok);
          if (failed) throw new Error(failed.error || 'BLM GTLF route catalog sync failed.');

          const layerTotals = new Map();
          for (const response of responses) {
            for (const layer of Array.isArray(response.layers) ? response.layers : []) {
              const key = String(layer.layerId);
              const existing = layerTotals.get(key) || {
                layerId: layer.layerId,
                layerName: layer.layerName,
                rawFeatureCount: 0,
                normalizedFeatureCount: 0,
                aggregateRouteCount: 0,
              };
              existing.rawFeatureCount += Number(layer.rawFeatureCount || 0);
              existing.normalizedFeatureCount += Number(layer.normalizedFeatureCount || 0);
              existing.aggregateRouteCount += Number(layer.aggregateRouteCount || 0);
              layerTotals.set(key, existing);
            }
          }

          fs.writeFileSync(
            'route-catalog-blm-gtlf-sync-response.json',
            JSON.stringify({
              ok: true,
              source: 'blm_gtlf',
              states: responses.flatMap((response) => Array.isArray(response.states) ? response.states : []),
              rawFeatureCount: responses.reduce((total, response) => total + Number(response.rawFeatureCount || 0), 0),
              normalizedFeatureCount: responses.reduce((total, response) => total + Number(response.normalizedFeatureCount || 0), 0),
              aggregateRouteCount: responses.reduce((total, response) => total + Number(response.aggregateRouteCount || 0), 0),
              publicRecommendationCount: responses.reduce((total, response) => total + Number(response.publicRecommendationCount || 0), 0),
              layers: Array.from(layerTotals.values()).sort((a, b) => Number(a.layerId) - Number(b.layerId)),
              caveat: responses.find((response) => response.caveat)?.caveat || '',
            }, null, 2),
          );
          NODE

      - name: Summarize sync result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('route-catalog-blm-gtlf-sync-response.json', 'utf8'));

          if (!response.ok) {
            throw new Error(response.error || 'BLM GTLF route catalog sync failed.');
          }

          const layers = Array.isArray(response.layers) ? response.layers : [];
          const summaryRows = layers.map((layer) => ({
            layerId: layer.layerId,
            layerName: layer.layerName,
            rawFeatureCount: layer.rawFeatureCount,
            normalizedFeatureCount: layer.normalizedFeatureCount,
            aggregateRouteCount: layer.aggregateRouteCount,
          }));

          console.log(JSON.stringify({
            source: response.source,
            states: response.states,
            rawFeatureCount: response.rawFeatureCount,
            normalizedFeatureCount: response.normalizedFeatureCount,
            aggregateRouteCount: response.aggregateRouteCount,
            publicRecommendationCount: response.publicRecommendationCount,
            layers: summaryRows,
          }, null, 2));

          const markdown = [
            '## Route Catalog BLM GTLF Sync',
            '',
            `States: ${(response.states || []).join(', ')}`,
            '',
            '| Layer | Raw Features | Normalized Source Segments | Public aggregate routes |',
            '| --- | ---: | ---: | ---: |',
            ...summaryRows.map((layer) =>
              `| ${layer.layerId} - ${layer.layerName} | ${layer.rawFeatureCount} | ${layer.normalizedFeatureCount} | ${layer.aggregateRouteCount || 0} |`
            ),
            '',
            `Public aggregate routes: ${response.aggregateRouteCount || 0}`,
            `Public recommendations created: ${response.publicRecommendationCount || 0}`,
            '',
            response.caveat ? `_${response.caveat}_` : '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${markdown}\n`);
          NODE
