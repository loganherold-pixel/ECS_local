name: Route Catalog USFS MVUM Sync

on:
  schedule:
    - cron: '17 10 * * 2'
  workflow_dispatch:
    inputs:
      forests:
        description: Comma-separated USFS MVUM forest slugs to sync.
        required: false
        default: tahoe-national-forest,mendocino-national-forest,san-juan-national-forest,coconino-national-forest,manti-la-sal-national-forest,sawtooth-national-forest,deschutes-national-forest,kaibab-national-forest,prescott-national-forest,gila-national-forest,santa-fe-national-forest,carson-national-forest,rio-grande-national-forest,grand-mesa-uncompahgre-gunnison-national-forests,humboldt-toiyabe-national-forest,pike-san-isabel-national-forests,inyo-national-forest,plumas-national-forest,lassen-national-forest,shasta-trinity-national-forest,umpqua-national-forest,fremont-winema-national-forest,idaho-panhandle-national-forests,helena-lewis-and-clark-national-forest,fishlake-national-forest,black-hills-national-forest,uinta-wasatch-cache-national-forest,caribou-targhee-national-forest,klamath-national-forest,willamette-national-forest,boise-national-forest,lolo-national-forest,salmon-challis-national-forest,stanislaus-national-forest,dixie-national-forest,bitterroot-national-forest,mt-hood-national-forest,coronado-national-forest,sierra-national-forest,huron-manistee-national-forest,ozark-st-francis-national-forest,ottawa-national-forest,hiawatha-national-forest,chequamegon-nicolet-national-forest,national-forests-in-florida,ouachita-national-forest,mark-twain-national-forest,national-forests-in-mississippi,kisatchie-national-forest,george-washington-jefferson-national-forest,francis-marion-sumter-national-forests,national-forests-in-texas,national-forests-in-north-carolina,allegheny-national-forest,cherokee-national-forest,daniel-boone-national-forest,rogue-river-siskiyou-national-forests,medicine-bow-routt-national-forest,kootenai-national-forest,gifford-pinchot-national-forest,arapaho-roosevelt-national-forests,umatilla-national-forest,ochoco-national-forest,cibola-national-forest,eldorado-national-forest,nez-perce-clearwater-national-forest,payette-national-forest,superior-national-forest
      min_miles:
        description: Minimum MVUM segment miles to ingest.
        required: false
        default: '1'
      limit_per_forest_layer:
        description: Maximum features to request per forest/layer.
        required: false
        default: '150'
      max_allowable_offset:
        description: ArcGIS geometry simplification offset in degrees to keep dense MVUM sources within Edge limits.
        required: false
        default: '0.000025'
      current_conditions_json:
        description: Optional reviewed official current-condition overlay JSON.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: route-catalog-usfs-mvum-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync USFS MVUM catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      ECS_ROUTE_CATALOG_SYNC_TOKEN: ${{ secrets.ECS_ROUTE_CATALOG_SYNC_TOKEN }}
      FORESTS: ${{ inputs.forests || 'tahoe-national-forest,mendocino-national-forest,san-juan-national-forest,coconino-national-forest,manti-la-sal-national-forest,sawtooth-national-forest,deschutes-national-forest,kaibab-national-forest,prescott-national-forest,gila-national-forest,santa-fe-national-forest,carson-national-forest,rio-grande-national-forest,grand-mesa-uncompahgre-gunnison-national-forests,humboldt-toiyabe-national-forest,pike-san-isabel-national-forests,inyo-national-forest,plumas-national-forest,lassen-national-forest,shasta-trinity-national-forest,umpqua-national-forest,fremont-winema-national-forest,idaho-panhandle-national-forests,helena-lewis-and-clark-national-forest,fishlake-national-forest,black-hills-national-forest,uinta-wasatch-cache-national-forest,caribou-targhee-national-forest,klamath-national-forest,willamette-national-forest,boise-national-forest,lolo-national-forest,salmon-challis-national-forest,stanislaus-national-forest,dixie-national-forest,bitterroot-national-forest,mt-hood-national-forest,coronado-national-forest,sierra-national-forest,huron-manistee-national-forest,ozark-st-francis-national-forest,ottawa-national-forest,hiawatha-national-forest,chequamegon-nicolet-national-forest,national-forests-in-florida,ouachita-national-forest,mark-twain-national-forest,national-forests-in-mississippi,kisatchie-national-forest,george-washington-jefferson-national-forest,francis-marion-sumter-national-forests,national-forests-in-texas,national-forests-in-north-carolina,allegheny-national-forest,cherokee-national-forest,daniel-boone-national-forest,rogue-river-siskiyou-national-forests,medicine-bow-routt-national-forest,kootenai-national-forest,gifford-pinchot-national-forest,arapaho-roosevelt-national-forests,umatilla-national-forest,ochoco-national-forest,cibola-national-forest,eldorado-national-forest,nez-perce-clearwater-national-forest,payette-national-forest,superior-national-forest' }}
      MIN_MILES: ${{ inputs.min_miles || '1' }}
      LIMIT_PER_FOREST_LAYER: ${{ inputs.limit_per_forest_layer || '150' }}
      MAX_ALLOWABLE_OFFSET: ${{ inputs.max_allowable_offset || '0.000025' }}
      CURRENT_CONDITIONS_JSON: ${{ inputs.current_conditions_json || '' }}

    steps:
      - name: Validate sync secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${ECS_ROUTE_CATALOG_SYNC_TOKEN}" ]]; then
            echo "::error::Missing GitHub secret ECS_ROUTE_CATALOG_SYNC_TOKEN"
            exit 1
          fi

      - name: Build bounded sync payloads
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const forests = String(process.env.FORESTS || '')
            .split(',')
            .map((forest) => forest.trim())
            .filter(Boolean);
          const minMiles = Number(process.env.MIN_MILES || 1);
          const limitPerForestLayer = Number(process.env.LIMIT_PER_FOREST_LAYER || 150);
          const maxAllowableOffset = Number(process.env.MAX_ALLOWABLE_OFFSET || 0.000025);
          const currentConditionsJson = String(process.env.CURRENT_CONDITIONS_JSON || '').trim();

          if (forests.length === 0) throw new Error('At least one forest slug is required.');
          if (!Number.isFinite(minMiles) || minMiles <= 0) throw new Error('min_miles must be positive.');
          if (!Number.isFinite(limitPerForestLayer) || limitPerForestLayer <= 0) {
            throw new Error('limit_per_forest_layer must be positive.');
          }
          if (!Number.isFinite(maxAllowableOffset) || maxAllowableOffset <= 0) {
            throw new Error('max_allowable_offset must be positive.');
          }

          const boundedLimitPerForestLayer = Math.min(500, Math.round(limitPerForestLayer));
          const boundedMaxAllowableOffset = Math.min(0.001, maxAllowableOffset);
          let currentConditions = null;

          if (currentConditionsJson) {
            try {
              currentConditions = JSON.parse(currentConditionsJson);
            } catch (error) {
              throw new Error(`current_conditions_json must be valid JSON: ${error.message}`);
            }
          }

          const payloads = forests.map((forest) => {
            const payload = {
              forests: [forest],
              minMiles,
              limitPerForestLayer: boundedLimitPerForestLayer,
              maxAllowableOffset: boundedMaxAllowableOffset,
            };
            if (currentConditions) payload.currentConditions = currentConditions;
            return payload;
          });

          fs.writeFileSync(
            'route-catalog-usfs-mvum-sync-payloads.json',
            JSON.stringify(payloads, null, 2),
          );
          NODE

      - name: Invoke route catalog sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p route-catalog-usfs-mvum-sync-payloads route-catalog-usfs-mvum-sync-responses

          node <<'NODE'
          const fs = require('fs');
          const payloads = JSON.parse(fs.readFileSync('route-catalog-usfs-mvum-sync-payloads.json', 'utf8'));
          payloads.forEach((payload, index) => {
            fs.writeFileSync(
              `route-catalog-usfs-mvum-sync-payloads/payload-${index}.json`,
              JSON.stringify(payload),
            );
          });
          NODE

          payload_count="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('route-catalog-usfs-mvum-sync-payloads.json','utf8')).length)")"
          for index in $(seq 0 "$((payload_count - 1))"); do
            forest="$(node -e "const fs=require('fs'); const payloads=JSON.parse(fs.readFileSync('route-catalog-usfs-mvum-sync-payloads.json','utf8')); console.log(payloads[${index}].forests[0])")"
            response_file="route-catalog-usfs-mvum-sync-responses/response-${index}.json"
            status_file="route-catalog-usfs-mvum-sync-responses/status-${index}.txt"

            http_code="$(
              curl --show-error --silent \
                --request POST \
                --header "Content-Type: application/json" \
                --header "x-ecs-sync-token: ${ECS_ROUTE_CATALOG_SYNC_TOKEN}" \
                --data @"route-catalog-usfs-mvum-sync-payloads/payload-${index}.json" \
                "${ECS_SUPABASE_URL%/}/functions/v1/route-catalog-sync-usfs-mvum" \
                --output "${response_file}" \
                --write-out "%{http_code}" || true
            )"
            echo "${http_code}" > "${status_file}"

            if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
              echo "::error::USFS MVUM sync failed for ${forest} with HTTP ${http_code}"
              if [[ -s "${response_file}" ]]; then
                echo "Response body:"
                head -c 4000 "${response_file}"
                echo
              else
                echo "No response body was returned."
              fi
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('fs');
          const payloads = JSON.parse(fs.readFileSync('route-catalog-usfs-mvum-sync-payloads.json', 'utf8'));
          const responses = payloads.map((_, index) => {
            const raw = fs.readFileSync(`route-catalog-usfs-mvum-sync-responses/response-${index}.json`, 'utf8');
            try {
              return JSON.parse(raw);
            } catch (error) {
              throw new Error(`USFS MVUM sync response ${index} was not valid JSON: ${raw.slice(0, 300)}`);
            }
          });
          const failed = responses.find((response) => !response.ok);
          if (failed) throw new Error(failed.error || 'USFS MVUM route catalog sync failed.');

          fs.writeFileSync(
            'route-catalog-usfs-mvum-sync-response.json',
            JSON.stringify({
              ok: true,
              source: 'usfs_mvum',
              forests: responses.flatMap((response) => Array.isArray(response.forests) ? response.forests : []),
              caveat: responses.find((response) => response.caveat)?.caveat || '',
            }, null, 2),
          );
          NODE

      - name: Summarize sync result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('route-catalog-usfs-mvum-sync-response.json', 'utf8'));

          if (!response.ok) {
            throw new Error(response.error || 'USFS MVUM route catalog sync failed.');
          }

          const forests = Array.isArray(response.forests) ? response.forests : [];
          const summaryRows = forests.map((forest) => ({
            forest: forest.forest,
            rawFeatureCount: forest.rawFeatureCount,
            normalizedFeatureCount: forest.normalizedFeatureCount,
            aggregateRouteCount: forest.aggregateRouteCount,
            publicRecommendationCount: forest.publicRecommendationCount || 0,
            currentConditionClosureCount: forest.currentConditionClosureCount || 0,
            currentConditionBlockedRouteCount: forest.currentConditionBlockedRouteCount || 0,
          }));

          console.log(JSON.stringify({ source: response.source, forests: summaryRows }, null, 2));

          const markdown = [
            '## Route Catalog USFS MVUM Sync',
            '',
            '| Forest | Raw Features | Normalized Features | Aggregate Routes | Public Recommendations | Current Closures | Blocked Routes |',
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: |',
            ...summaryRows.map((forest) =>
              `| ${forest.forest} | ${forest.rawFeatureCount} | ${forest.normalizedFeatureCount} | ${forest.aggregateRouteCount} | ${forest.publicRecommendationCount} | ${forest.currentConditionClosureCount} | ${forest.currentConditionBlockedRouteCount} |`
            ),
            '',
            response.caveat ? `_${response.caveat}_` : '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${markdown}\n`);
          NODE
