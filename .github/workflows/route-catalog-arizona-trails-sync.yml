name: Route Catalog Arizona Trails Sync

on:
  workflow_dispatch:
    inputs:
      min_miles:
        description: Minimum Arizona State Parks motorized trail miles to ingest.
        required: false
        default: '0.25'
      max_features:
        description: Maximum open/verified/road motorized Arizona trail features to normalize.
        required: false
        default: '250'
      sync_scope:
        description: Use cautious for a 250-feature slice, or backfill for the bounded 1000-feature pass.
        required: false
        default: cautious
        type: choice
        options:
          - cautious
          - backfill

permissions:
  contents: read

concurrency:
  group: route-catalog-data-plane-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Arizona State Parks motorized trail records
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      ECS_ROUTE_CATALOG_SYNC_TOKEN: ${{ secrets.ECS_ROUTE_CATALOG_SYNC_TOKEN }}
      MIN_MILES: ${{ inputs.min_miles || '0.25' }}
      MAX_FEATURES: ${{ inputs.max_features || '' }}
      SYNC_SCOPE: ${{ inputs.sync_scope || 'cautious' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Arizona trails sync configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${ECS_ROUTE_CATALOG_SYNC_TOKEN}" ]]; then
            echo "::error::Missing GitHub secret ECS_ROUTE_CATALOG_SYNC_TOKEN"
            exit 1
          fi

      - name: Build bounded Arizona trails sync payload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const syncScope = String(process.env.SYNC_SCOPE || 'cautious').trim().toLowerCase();
          if (!['cautious', 'backfill'].includes(syncScope)) {
            throw new Error('sync_scope must be cautious or backfill.');
          }

          const minMiles = Number(process.env.MIN_MILES || 0.25);
          const maxFeaturesOverride = String(process.env.MAX_FEATURES || '').trim();
          const maxFeatures = maxFeaturesOverride
            ? Number(maxFeaturesOverride)
            : syncScope === 'backfill'
              ? 1000
              : 250;

          if (!Number.isFinite(minMiles) || minMiles <= 0) throw new Error('min_miles must be positive.');
          if (!Number.isFinite(maxFeatures) || maxFeatures <= 0) throw new Error('max_features must be positive.');

          const payload = {
            minMiles,
            maxFeatures: Math.min(1000, Math.round(maxFeatures)),
          };

          fs.writeFileSync('route-catalog-arizona-trails-sync-payload.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE

      - name: Invoke Arizona trails route catalog sync
        shell: bash
        run: |
          set -euo pipefail
          curl_exit=0
          http_code=$(curl --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-ecs-sync-token: ${ECS_ROUTE_CATALOG_SYNC_TOKEN}" \
            --data @route-catalog-arizona-trails-sync-payload.json \
            "${ECS_SUPABASE_URL%/}/functions/v1/route-catalog-sync-arizona-trails" \
            --output route-catalog-arizona-trails-sync-response.json \
            --write-out "%{http_code}") || curl_exit=$?

          if [[ "${curl_exit}" -ne 0 || ! "${http_code}" =~ ^[0-9]+$ || "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Arizona trails route catalog sync failed with HTTP ${http_code:-unknown}"
            node <<'NODE'
          const fs = require('fs');
          const responsePath = 'route-catalog-arizona-trails-sync-response.json';
          if (!fs.existsSync(responsePath)) {
            console.error('No response body was written by the sync request.');
            process.exit(0);
          }
          const raw = fs.readFileSync(responsePath, 'utf8').trim();
          if (!raw) {
            console.error('Sync response body was empty.');
            process.exit(0);
          }
          try {
            const response = JSON.parse(raw);
            console.error(JSON.stringify({
              ok: response.ok,
              source: response.source,
              error: response.error,
              publicRecommendationCount: response.publicRecommendationCount,
            }, null, 2));
          } catch {
            console.error(raw.slice(0, 1200));
          }
          NODE
            exit 1
          fi

      - name: Summarize Arizona trails sync
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('route-catalog-arizona-trails-sync-response.json', 'utf8'));
          if (!response.ok) {
            throw new Error(response.error || 'Arizona trails route catalog sync failed.');
          }

          const markdown = [
            '## Route Catalog Arizona Trails Sync',
            '',
            `Sync scope: ${process.env.SYNC_SCOPE || 'cautious'}`,
            '',
            '| Raw Features | Normalized Features | Public Recommendations | Min Miles | Max Features |',
            '| ---: | ---: | ---: | ---: | ---: |',
            `| ${response.rawFeatureCount || 0} | ${response.normalizedFeatureCount || 0} | ${response.publicRecommendationCount || 0} | ${response.minMiles || ''} | ${response.maxFeatures || ''} |`,
            '',
            response.caveat ? `_${response.caveat}_` : '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${markdown}\n`);
          console.log(JSON.stringify({
            source: response.source,
            rawFeatureCount: response.rawFeatureCount,
            normalizedFeatureCount: response.normalizedFeatureCount,
            publicRecommendationCount: response.publicRecommendationCount,
          }, null, 2));
          NODE
