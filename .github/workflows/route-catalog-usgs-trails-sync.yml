      bbox:
        description: Optional custom bounded sync bbox as west,south,east,north. Used when set.
        required: false
        default: ''
      min_miles:
        description: Minimum USGS trail segment miles to ingest.
        required: false
        default: '1'
      limit:
        description: Maximum features to request for the bbox.
        required: false
        default: '150'

permissions:
  contents: read

concurrency:
  group: route-catalog-data-plane-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync USGS Trails supplemental geometry
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      ECS_ROUTE_CATALOG_SYNC_TOKEN: ${{ secrets.ECS_ROUTE_CATALOG_SYNC_TOKEN }}
      BBOX_BATCH: ${{ inputs.bbox_batch || 'desert_mountain_wilderness_context' }}
      BBOX: ${{ inputs.bbox || '' }}
      MIN_MILES: ${{ inputs.min_miles || '1' }}
      LIMIT: ${{ inputs.limit || '150' }}

    steps:
      - name: Validate sync secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${ECS_ROUTE_CATALOG_SYNC_TOKEN}" ]]; then
            echo "::error::Missing GitHub secret ECS_ROUTE_CATALOG_SYNC_TOKEN"
            exit 1
          fi

