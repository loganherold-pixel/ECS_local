      - name: Invoke USGS Trails route catalog sync
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-ecs-sync-token: ${ECS_ROUTE_CATALOG_SYNC_TOKEN}" \
            --data @route-catalog-usgs-trails-sync-payload.json \
            "${ECS_SUPABASE_URL%/}/functions/v1/route-catalog-sync-usgs-trails" \
            --output route-catalog-usgs-trails-sync-response.json

      - name: Summarize sync result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('route-catalog-usgs-trails-sync-response.json', 'utf8'));

          if (!response.ok) {
            throw new Error(response.error || 'USGS Trails route catalog sync failed.');
          }

          console.log(JSON.stringify({
            source: response.source,
            bbox: response.bbox,
            bboxes: response.bboxes,
            rawFeatureCount: response.rawFeatureCount,
            normalizedFeatureCount: response.normalizedFeatureCount,
            publicRecommendationCount: response.publicRecommendationCount,
          }, null, 2));

          const markdown = [
            '## Route Catalog USGS Trails Sync',
            '',
            `BBoxes: ${JSON.stringify(response.bboxes || (response.bbox ? [{ key: 'custom_bbox', bbox: response.bbox }] : []))}`,
            '',
            `Raw features: ${response.rawFeatureCount}`,
            '',
            `Normalized supplemental geometry records: ${response.normalizedFeatureCount}`,
            '',
            `Public recommendations created: ${response.publicRecommendationCount || 0}`,
            '',
            response.caveat ? `_${response.caveat}_` : '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${markdown}\n`);
          NODE
