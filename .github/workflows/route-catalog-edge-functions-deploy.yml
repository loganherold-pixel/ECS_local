name: Route Catalog Edge Functions Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/route-catalog-search/**'
      - 'supabase/functions/route-catalog-detail/**'
      - 'supabase/functions/route-submission-intake/**'
      - 'supabase/functions/route-catalog-sync-*/**'
      - 'supabase/functions/_shared/routeCatalog*.ts'
      - 'supabase/config.toml'
      - 'scripts/route-catalog-sync-inventory.js'
      - '.github/workflows/route-catalog-edge-functions-deploy.yml'

permissions:
  contents: read

concurrency:
  group: route-catalog-edge-functions-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy route catalog Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ECS_SUPABASE_PROJECT_REF: ${{ secrets.ECS_SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [[ -z "${ECS_SUPABASE_PROJECT_REF}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Deploy route catalog Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "route-catalog-search" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-detail" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-submission-intake" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-sync-usfs-mvum" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-sync-blm-gtlf" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-sync-usgs-trails" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-sync-nps-trails" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-sync-michigan-orv" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-sync-minnesota-ohv" --project-ref "${ECS_SUPABASE_PROJECT_REF}"
          supabase functions deploy "route-catalog-sync-oregon-odf-ohv" --project-ref "${ECS_SUPABASE_PROJECT_REF}"

      - name: Summarize deployment
        shell: bash
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<'MARKDOWN'
          ## Route Catalog Edge Functions Deploy

          | Function | Runtime role |
          | --- | --- |
          | route-catalog-search | Public catalog search |
          | route-catalog-detail | Public approved route detail |
          | route-submission-intake | Authenticated private submission intake |
          | route-catalog-sync-usfs-mvum | Protected official-access sync |
          | route-catalog-sync-blm-gtlf | Protected official-access curation sync |
          | route-catalog-sync-usgs-trails | Protected supplemental geometry sync |
          | route-catalog-sync-nps-trails | Protected park-context curation sync |
          | route-catalog-sync-michigan-orv | Protected state OHV curation sync |
          | route-catalog-sync-minnesota-ohv | Protected state OHV curation sync |
          | route-catalog-sync-oregon-odf-ohv | Protected state OHV curation sync |

          Deploys only the Edge Function code. Source ingestion remains token-protected and is invoked by the dedicated sync workflows.
          MARKDOWN
