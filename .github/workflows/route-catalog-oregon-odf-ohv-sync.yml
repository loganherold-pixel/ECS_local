name: Route Catalog Oregon ODF OHV Sync

on:
  workflow_dispatch:
    inputs:
      source_keys:
        description: Comma-separated Oregon ODF OHV GPX source keys.
        required: false
        default: tillamook_class_i,tillamook_class_ii_iv,tillamook_class_iii
      min_miles:
        description: Minimum GPX track miles to ingest.
        required: false
        default: '0.25'
      max_tracks_per_source:
        description: Maximum tracks to normalize per named GPX source.
        required: false
        default: '50'

permissions:
  contents: read

concurrency:
  group: route-catalog-oregon-odf-ohv-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Oregon ODF OHV GPX records
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      ECS_ROUTE_CATALOG_SYNC_TOKEN: ${{ secrets.ECS_ROUTE_CATALOG_SYNC_TOKEN }}
      SOURCE_KEYS: ${{ inputs.source_keys || 'tillamook_class_i,tillamook_class_ii_iv,tillamook_class_iii' }}
      MIN_MILES: ${{ inputs.min_miles || '0.25' }}
      MAX_TRACKS_PER_SOURCE: ${{ inputs.max_tracks_per_source || '50' }}

    steps:
      - name: Validate sync secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${ECS_ROUTE_CATALOG_SYNC_TOKEN}" ]]; then
            echo "::error::Missing GitHub secret ECS_ROUTE_CATALOG_SYNC_TOKEN"
            exit 1
          fi

      - name: Build bounded sync payload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const sourceKeys = String(process.env.SOURCE_KEYS || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          const minMiles = Number(process.env.MIN_MILES || 0.25);
          const maxTracksPerSource = Number(process.env.MAX_TRACKS_PER_SOURCE || 50);

          if (sourceKeys.length === 0) throw new Error('At least one Oregon ODF OHV GPX source key is required.');
          if (!Number.isFinite(minMiles) || minMiles <= 0) throw new Error('min_miles must be positive.');
          if (!Number.isFinite(maxTracksPerSource) || maxTracksPerSource <= 0) {
            throw new Error('max_tracks_per_source must be positive.');
          }

          fs.writeFileSync(
            'route-catalog-oregon-odf-ohv-sync-payload.json',
            JSON.stringify({
              sourceKeys,
              minMiles,
              maxTracksPerSource: Math.min(200, Math.round(maxTracksPerSource)),
            }),
          );
          NODE

      - name: Invoke Oregon ODF OHV route catalog sync
        shell: bash
        run: |
          set -euo pipefail
          curl_exit=0
          http_code=$(curl --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-ecs-sync-token: ${ECS_ROUTE_CATALOG_SYNC_TOKEN}" \
            --data @route-catalog-oregon-odf-ohv-sync-payload.json \
            "${ECS_SUPABASE_URL%/}/functions/v1/route-catalog-sync-oregon-odf-ohv" \
            --output route-catalog-oregon-odf-ohv-sync-response.json \
            --write-out "%{http_code}") || curl_exit=$?

          if [[ "${curl_exit}" -ne 0 || ! "${http_code}" =~ ^[0-9]+$ || "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Oregon ODF OHV sync failed with HTTP ${http_code:-unknown}"
            node <<'NODE'
          const fs = require('fs');
          const responsePath = 'route-catalog-oregon-odf-ohv-sync-response.json';
          if (!fs.existsSync(responsePath)) {
            console.error('No response body was written by the sync request.');
            process.exit(0);
          }
          const raw = fs.readFileSync(responsePath, 'utf8').trim();
          if (!raw) {
            console.error('Sync response body was empty.');
            process.exit(0);
          }
          try {
            const response = JSON.parse(raw);
            console.error(JSON.stringify({
              ok: response.ok,
              source: response.source,
              error: response.error,
            }, null, 2));
          } catch {
            console.error(raw.slice(0, 1200));
          }
          NODE
            exit 1
          fi

      - name: Summarize sync result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('route-catalog-oregon-odf-ohv-sync-response.json', 'utf8'));

          if (!response.ok) {
            throw new Error(response.error || 'Oregon ODF OHV route catalog sync failed.');
          }

          const sources = Array.isArray(response.sources) ? response.sources : [];
          const summaryRows = sources.map((source) => ({
            sourceKey: source.sourceKey,
            sourceName: source.sourceName,
            rawFeatureCount: source.rawFeatureCount,
            normalizedFeatureCount: source.normalizedFeatureCount,
          }));

          console.log(JSON.stringify({
            source: response.source,
            sourceKeys: response.sourceKeys,
            rawFeatureCount: response.rawFeatureCount,
            normalizedFeatureCount: response.normalizedFeatureCount,
            publicRecommendationCount: response.publicRecommendationCount,
            sources: summaryRows,
          }, null, 2));

          const markdown = [
            '## Route Catalog Oregon ODF OHV Sync',
            '',
            '| Source | Raw Tracks | Normalized Curation Records |',
            '| --- | ---: | ---: |',
            ...summaryRows.map((source) =>
              `| ${source.sourceKey} - ${source.sourceName} | ${source.rawFeatureCount} | ${source.normalizedFeatureCount} |`
            ),
            '',
            `Public recommendations created: ${response.publicRecommendationCount || 0}`,
            '',
            response.caveat ? `_${response.caveat}_` : '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${markdown}\n`);
          NODE
