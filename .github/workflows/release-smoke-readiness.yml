name: ECS Pull Request Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecs-pr-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  ECS_TEST_NETWORK: disabled
  ECS_TEST_SEED: ecs-verification-v1
  TZ: UTC

jobs:
  fast:
    name: Fast code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inventory verification coverage
        run: node scripts/verification/verification-inventory.mjs --strict --artifact-audience pull_request --output .smoke/verification/inventory.json
      - name: Run fast pull-request lane
        run: node scripts/verification/run-verification-lane.mjs --lane pr-fast --timing-baseline config/verification-timing-baseline.json --artifact-audience pull_request --output .smoke/verification/pr-fast.json --summary-output .smoke/verification/pr-fast.md --timings-output .smoke/verification/timings.json
      - name: Upload machine-readable verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-pr-fast-verification
          path: |
            .smoke/verification/inventory.json
            .smoke/verification/pr-fast.json
            .smoke/verification/pr-fast.md
            .smoke/verification/runtime-regression-fast.json
            .smoke/verification/runtime-regression-fast.md
            .smoke/verification/timings.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 5

  affected-domain:
    name: Affected-domain regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ECS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      ECS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run affected-domain lane
        run: node scripts/verification/run-verification-lane.mjs --lane affected-domain --timing-baseline config/verification-timing-baseline.json --artifact-audience pull_request --base "$ECS_BASE_SHA" --head "$ECS_HEAD_SHA" --output .smoke/verification/affected-domain.json --summary-output .smoke/verification/affected-domain.md --timings-output .smoke/verification/timings.json
      - name: Upload affected-domain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-affected-domain-verification
          path: |
            .smoke/verification/affected-domain.json
            .smoke/verification/affected-domain.md
            .smoke/verification/runtime-regression-integration.json
            .smoke/verification/runtime-regression-integration.md
            .smoke/verification/timings.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 5
