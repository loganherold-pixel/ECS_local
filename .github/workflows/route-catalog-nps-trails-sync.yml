name: Route Catalog NPS Trails Sync

on:
  workflow_dispatch:
    inputs:
      bbox_batch:
        description: Bounded NPS trail bbox batch to sync.
        required: false
        default: expanded_motorized_pilots
        type: choice
        options:
          - expanded_motorized_pilots
          - joshua_tree
          - custom_bbox
      bbox:
        description: Optional custom bounded sync bbox as west,south,east,north. Used when set.
        required: false
        default: ''
      min_miles:
        description: Minimum calculated NPS trail segment miles to ingest.
        required: false
        default: '0.1'
      limit:
        description: Maximum features to request per bbox.
        required: false
        default: '150'

permissions:
  contents: read

concurrency:
  group: route-catalog-data-plane-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync NPS public trails context
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      ECS_ROUTE_CATALOG_SYNC_TOKEN: ${{ secrets.ECS_ROUTE_CATALOG_SYNC_TOKEN }}
      BBOX_BATCH: ${{ inputs.bbox_batch || 'expanded_motorized_pilots' }}
      BBOX: ${{ inputs.bbox || '' }}
      MIN_MILES: ${{ inputs.min_miles || '0.1' }}
      LIMIT: ${{ inputs.limit || '150' }}

    steps:
      - name: Validate sync secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${ECS_ROUTE_CATALOG_SYNC_TOKEN}" ]]; then
            echo "::error::Missing GitHub secret ECS_ROUTE_CATALOG_SYNC_TOKEN"
            exit 1
          fi

      - name: Build bounded sync payload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const minMiles = Number(process.env.MIN_MILES || 0.1);
          const limit = Number(process.env.LIMIT || 150);
          const bboxBatch = String(process.env.BBOX_BATCH || 'expanded_motorized_pilots');
          const customBbox = String(process.env.BBOX || '').trim();

          const bboxPresets = {
            joshua_tree: {
              key: 'joshua_tree',
              label: 'Joshua Tree National Park',
              bbox: { xmin: -116.3066, ymin: 33.7377, xmax: -115.7726, ymax: 34.2586 },
            },
            big_south_fork: {
              key: 'big_south_fork',
              label: 'Big South Fork National River and Recreation Area',
              bbox: { xmin: -85.044, ymin: 36.2043, xmax: -84.2655, ymax: 36.9675 },
            },
            shenandoah: {
              key: 'shenandoah',
              label: 'Shenandoah National Park',
              bbox: { xmin: -78.5545, ymin: 38.5115, xmax: -78.0496, ymax: 39.0132 },
            },
            everglades: {
              key: 'everglades',
              label: 'Everglades National Park',
              bbox: { xmin: -81.0171, ymin: 25.4077, xmax: -80.5086, ymax: 26.007 },
            },
            timucuan: {
              key: 'timucuan',
              label: 'Timucuan Ecological and Historic Preserve',
              bbox: { xmin: -81.9059, ymin: 30.2815, xmax: -81.3716, ymax: 30.8132 },
            },
            channel_islands: {
              key: 'channel_islands',
              label: 'Channel Islands National Park',
              bbox: { xmin: -120.6832, ymin: 33.7801, xmax: -120.1632, ymax: 34.2924 },
            },
            denali: {
              key: 'denali',
              label: 'Denali National Park and Preserve',
              bbox: { xmin: -151.2385, ymin: 63.2606, xmax: -150.4213, ymax: 63.8374 },
            },
            wrangell_st_elias: {
              key: 'wrangell_st_elias',
              label: 'Wrangell-St Elias National Park and Preserve',
              bbox: { xmin: -144.5504, ymin: 61.2366, xmax: -142.5884, ymax: 62.8671 },
            },
            glacier_bay: {
              key: 'glacier_bay',
              label: 'Glacier Bay National Park and Preserve',
              bbox: { xmin: -138.831, ymin: 58.8263, xmax: -137.9997, ymax: 59.4408 },
            },
            klondike_gold_rush: {
              key: 'klondike_gold_rush',
              label: 'Klondike Gold Rush National Historical Park',
              bbox: { xmin: -135.6085, ymin: 59.243, xmax: -135.0971, ymax: 59.7734 },
            },
            lake_clark: {
              key: 'lake_clark',
              label: 'Lake Clark National Park and Preserve',
              bbox: { xmin: -154.5629, ymin: 59.9417, xmax: -154.0563, ymax: 60.4472 },
            },
            yukon_charley: {
              key: 'yukon_charley',
              label: 'Yukon-Charley Rivers National Preserve',
              bbox: { xmin: -143.6243, ymin: 65.0307, xmax: -142.8633, ymax: 65.6006 },
            },
            kaloko_honokohau: {
              key: 'kaloko_honokohau',
              label: 'Kaloko-Honokohau National Historical Park',
              bbox: { xmin: -156.0754, ymin: 19.6211, xmax: -155.9667, ymax: 19.7284 },
            },
            american_samoa: {
              key: 'american_samoa',
              label: 'National Park of American Samoa',
              bbox: { xmin: -170.7226, ymin: -14.2951, xmax: -170.6212, ymax: -14.1921 },
            },
            war_in_the_pacific: {
              key: 'war_in_the_pacific',
              label: 'War in the Pacific National Historical Park',
              bbox: { xmin: 144.6441, ymin: 13.4112, xmax: 144.7618, ymax: 13.5236 },
            },
          };

          function parseBbox(value) {
            const bboxValues = String(value || '')
              .split(',')
              .map((part) => Number(part.trim()));
            if (bboxValues.length !== 4 || bboxValues.some((number) => !Number.isFinite(number))) {
              throw new Error('bbox must be west,south,east,north.');
            }
            const [xmin, ymin, xmax, ymax] = bboxValues;
            if (xmin >= xmax || ymin >= ymax || Math.abs(xmin) > 180 || Math.abs(xmax) > 180 || Math.abs(ymin) > 90 || Math.abs(ymax) > 90) {
              throw new Error('bbox values are out of range or inverted.');
            }
            return { xmin, ymin, xmax, ymax };
          }

          if (!Number.isFinite(minMiles) || minMiles <= 0) throw new Error('min_miles must be positive.');
          if (!Number.isFinite(limit) || limit <= 0) throw new Error('limit must be positive.');

          const batchKeys = bboxBatch === 'expanded_motorized_pilots'
            ? [
                'joshua_tree',
                'big_south_fork',
                'shenandoah',
                'everglades',
                'timucuan',
                'channel_islands',
                'denali',
                'wrangell_st_elias',
                'glacier_bay',
                'klondike_gold_rush',
                'lake_clark',
                'yukon_charley',
                'kaloko_honokohau',
                'american_samoa',
                'war_in_the_pacific',
              ]
            : [bboxBatch];

          const payload = customBbox
            ? {
                bboxes: [{ key: 'custom_bbox', label: 'Custom bbox', bbox: parseBbox(customBbox) }],
                minMiles,
                limitPerBbox: Math.min(500, Math.round(limit)),
              }
            : {
                bboxes: batchKeys.map((key) => {
                  const preset = bboxPresets[key];
                  if (!preset) throw new Error(`Unknown bbox_batch: ${bboxBatch}`);
                  return preset;
                }),
                minMiles,
                limitPerBbox: Math.min(500, Math.round(limit)),
              };

          fs.writeFileSync(
            'route-catalog-nps-trails-sync-payload.json',
            JSON.stringify(payload),
          );
          NODE

      - name: Invoke NPS public trails route catalog sync
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-ecs-sync-token: ${ECS_ROUTE_CATALOG_SYNC_TOKEN}" \
            --data @route-catalog-nps-trails-sync-payload.json \
            "${ECS_SUPABASE_URL%/}/functions/v1/route-catalog-sync-nps-trails" \
            --output route-catalog-nps-trails-sync-response.json

      - name: Summarize sync result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('route-catalog-nps-trails-sync-response.json', 'utf8'));

          if (!response.ok) {
            throw new Error(response.error || 'NPS public trails route catalog sync failed.');
          }

          console.log(JSON.stringify({
            source: response.source,
            bbox: response.bbox,
            bboxes: response.bboxes,
            rawFeatureCount: response.rawFeatureCount,
            normalizedFeatureCount: response.normalizedFeatureCount,
            publicRecommendationCount: response.publicRecommendationCount,
          }, null, 2));

          const markdown = [
            '## Route Catalog NPS Public Trails Sync',
            '',
            `BBoxes: ${JSON.stringify(response.bboxes || (response.bbox ? [{ key: 'custom_bbox', bbox: response.bbox }] : []))}`,
            '',
            `Raw features: ${response.rawFeatureCount}`,
            '',
            `Normalized park-context records: ${response.normalizedFeatureCount}`,
            '',
            `Public recommendations created: ${response.publicRecommendationCount || 0}`,
            '',
            response.caveat ? `_${response.caveat}_` : '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${markdown}\n`);
          NODE
