name: Route Catalog Summary Report

on:
  schedule:
    - cron: '44 14 * * 4'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Route Catalog USFS MVUM Sync
      - Route Catalog BLM GTLF Sync
      - Route Catalog Michigan ORV Sync
      - Route Catalog Minnesota OHV Sync
      - Route Catalog Oregon ODF OHV Sync
      - Route Catalog USGS Trails Sync
      - Route Catalog NPS Trails Sync
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: route-catalog-data-plane-${{ github.repository }}
  cancel-in-progress: false

jobs:
  summarize:
    name: Summarize live route catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate summary endpoint configuration
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY}" ]]; then
            echo "::warning::Missing GitHub secret EXPO_PUBLIC_SUPABASE_ANON_KEY; invoking public function without a publishable key"
          fi

      - name: Run Route Catalog Summary Report
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/route-catalog-summary-report.js --json --timeout-ms 60000 --max-route-rows 1000 --max-link-rows 5000 --max-ingest-run-rows 500 | tee route-catalog-summary-report.json

      - name: Summarize route catalog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s route-catalog-summary-report.json ]]; then
            echo "No route catalog summary output was produced." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const {
            extractJsonPayloadFromOutput,
            formatWorkflowSummaryMarkdown,
          } = require('./scripts/route-catalog-summary-report.js');

          const raw = fs.readFileSync('route-catalog-summary-report.json', 'utf8');
          let response;
          try {
            response = extractJsonPayloadFromOutput(raw, 'Route catalog summary output');
          } catch (error) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${error.message}\n`);
            process.exit(0);
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `${formatWorkflowSummaryMarkdown(response)}\n`,
          );
          NODE
