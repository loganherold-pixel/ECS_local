name: Route Catalog Coverage Audit

on:
  schedule:
    - cron: '28 13 * * 4'
  workflow_dispatch:
    inputs:
      probe_keys:
        description: Comma-separated coverage probe keys to audit, or all.
        required: false
        default: all
  workflow_run:
    workflows:
      - Route Catalog USFS MVUM Sync
      - Route Catalog BLM GTLF Sync
      - Route Catalog Michigan ORV Sync
      - Route Catalog Minnesota OHV Sync
      - Route Catalog NPS Trails Sync
      - Route Catalog Oregon ODF OHV Sync
      - Route Catalog USGS Trails Sync
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: route-catalog-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit live route catalog coverage probes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ECS_SUPABASE_URL: ${{ secrets.ECS_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      PROBE_KEYS: ${{ github.event.inputs.probe_keys || 'all' }}
      TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
      ROUTE_CATALOG_AUDIT_RETRY_ATTEMPTS: 3
      ROUTE_CATALOG_AUDIT_RETRY_DELAY_MS: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate audit secret
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub secret ECS_SUPABASE_URL"
            exit 1
          fi

      - name: Build audit probe selection
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const manualProbeKeys = String(process.env.PROBE_KEYS || 'all')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          const triggerWorkflowName = String(process.env.TRIGGER_WORKFLOW_NAME || '').trim();
          const probesByWorkflow = {
            'Route Catalog USFS MVUM Sync': [
              'tahoe_national_forest',
              'mendocino_national_forest',
              'san_juan_national_forest',
              'coconino_national_forest',
              'manti_la_sal_national_forest',
              'sawtooth_national_forest',
              'deschutes_national_forest',
              'kaibab_national_forest',
              'prescott_national_forest',
              'gila_national_forest',
              'santa_fe_national_forest',
              'carson_national_forest',
              'rio_grande_national_forest',
              'gmug_national_forests',
              'humboldt_toiyabe_national_forest',
              'pike_san_isabel_national_forests',
              'inyo_national_forest',
              'plumas_national_forest',
              'lassen_national_forest',
              'shasta_trinity_national_forest',
              'umpqua_national_forest',
              'fremont_winema_national_forest',
              'idaho_panhandle_national_forests',
              'helena_lewis_clark_national_forest',
              'fishlake_national_forest',
              'black_hills_national_forest',
              'uinta_wasatch_cache_national_forest',
              'caribou_targhee_national_forest',
              'klamath_national_forest',
              'willamette_national_forest',
              'boise_national_forest',
              'lolo_national_forest',
              'salmon_challis_national_forest',
              'stanislaus_national_forest',
              'dixie_national_forest',
              'bitterroot_national_forest',
              'mt_hood_national_forest',
              'coronado_national_forest',
              'sierra_national_forest',
              'huron_manistee_national_forest',
              'ozark_st_francis_national_forest',
              'ottawa_national_forest',
              'hiawatha_national_forest',
              'chequamegon_nicolet_national_forest',
              'national_forests_in_florida',
              'ouachita_national_forest',
              'mark_twain_national_forest',
              'national_forests_in_mississippi',
              'kisatchie_national_forest',
              'george_washington_jefferson_national_forest',
              'francis_marion_sumter_national_forests',
              'national_forests_in_texas',
              'national_forests_in_north_carolina',
              'allegheny_national_forest',
              'cherokee_national_forest',
              'daniel_boone_national_forest',
              'rogue_river_siskiyou_national_forests',
              'medicine_bow_routt_national_forest',
              'kootenai_national_forest',
              'gifford_pinchot_national_forest',
              'arapaho_roosevelt_national_forests',
              'umatilla_national_forest',
              'ochoco_national_forest',
              'cibola_national_forest',
              'eldorado_national_forest',
              'nez_perce_clearwater_national_forest',
              'payette_national_forest',
              'superior_national_forest',
              'chippewa_national_forest',
              'sequoia_national_forest',
              'ashley_national_forest',
              'bridger_teton_national_forest',
              'siuslaw_national_forest',
              'lincoln_national_forest',
              'white_river_national_forest',
              'mt_baker_snoqualmie_national_forest',
              'flathead_national_forest',
              'olympic_national_forest',
              'custer_national_forest',
              'bighorn_national_forest',
              'colville_national_forest',
              'chattahoochee_oconee_national_forests',
              'nebraska_national_forest',
              'shoshone_national_forest',
              'san_bernardino_national_forest',
              'los_padres_national_forest',
              'dakota_prairie_grasslands',
              'monongahela_national_forest',
              'land_between_the_lakes_nra',
              'shawnee_national_forest',
              'cleveland_national_forest',
              'green_mountain_finger_lakes_national_forests',
              'lake_tahoe_basin_management_unit',
              'wayne_national_forest',
              'white_mountain_national_forest',
              'wallowa_whitman_national_forest',
              'hoosier_national_forest',
              'columbia_river_gorge_national_scenic_area',
              'okanogan_wenatchee_national_forest',
              'six_rivers_national_forest',
              'tonto_national_forest',
            ],
            'Route Catalog BLM GTLF Sync': [
              'blm_az_gtlf',
              'blm_ca_nv_pilot',
              'blm_co_gtlf',
              'blm_id_gtlf',
              'blm_mt_gtlf',
              'blm_nm_gtlf',
              'blm_ut_gtlf',
              'blm_wy_gtlf',
            ],
            'Route Catalog Michigan ORV Sync': ['michigan_dnr_orv_pilot'],
            'Route Catalog Minnesota OHV Sync': ['minnesota_dnr_ohv_pilot'],
            'Route Catalog NPS Trails Sync': ['nps_public_trails_joshua_tree'],
            'Route Catalog Oregon ODF OHV Sync': ['oregon_odf_ohv_pilot'],
            'Route Catalog USGS Trails Sync': ['usgs_nps_sierra_context'],
          };

          const selectedProbeKeys = triggerWorkflowName
            ? probesByWorkflow[triggerWorkflowName] || []
            : manualProbeKeys.some((key) => key.toLowerCase() === 'all')
              ? []
              : manualProbeKeys;
          const args = selectedProbeKeys.length > 0
            ? selectedProbeKeys.flatMap((key) => ['--probe', key])
            : ['--all'];

          fs.appendFileSync(process.env.GITHUB_ENV, `ROUTE_CATALOG_AUDIT_ARGS=${args.join(' ')}\n`);
          fs.writeFileSync(
            'route-catalog-coverage-audit-selection.json',
            JSON.stringify({
              triggerWorkflowName,
              selectedProbeKeys,
              auditsAllProbes: selectedProbeKeys.length === 0,
            }, null, 2),
          );
          NODE

      - name: Run Route Catalog Coverage Audit
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/route-catalog-coverage-audit.js ${ROUTE_CATALOG_AUDIT_ARGS} --json --fail-on-mismatch | tee route-catalog-coverage-audit.json

      - name: Summarize coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s route-catalog-coverage-audit.json ]]; then
            echo "No route catalog coverage audit output was produced." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const { extractJsonPayloadFromOutput } = require('./scripts/route-catalog-summary-report.js');
          const { formatCoverageAuditWorkflowMarkdown } = require('./scripts/route-catalog-coverage-audit.js');

          const raw = fs.readFileSync('route-catalog-coverage-audit.json', 'utf8');
          let response;
          try {
            response = extractJsonPayloadFromOutput(raw, 'Route catalog coverage audit output');
          } catch (error) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${error.message}\n`);
            process.exit(0);
          }
          const selection = fs.existsSync('route-catalog-coverage-audit-selection.json')
            ? JSON.parse(fs.readFileSync('route-catalog-coverage-audit-selection.json', 'utf8'))
            : {};

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${formatCoverageAuditWorkflowMarkdown(response, selection)}\n`);
          NODE

      - name: Check expected coverage posture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s route-catalog-coverage-audit.json ]]; then
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const { extractJsonPayloadFromOutput } = require('./scripts/route-catalog-summary-report.js');
          const { assertCoverageAuditExpectedPosture } = require('./scripts/route-catalog-coverage-audit.js');

          const raw = fs.readFileSync('route-catalog-coverage-audit.json', 'utf8');
          let response;
          try {
            response = extractJsonPayloadFromOutput(raw, 'Route catalog coverage audit output');
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }
          try {
            assertCoverageAuditExpectedPosture(response);
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }
          NODE
